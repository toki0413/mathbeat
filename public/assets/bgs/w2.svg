      <stop offset="0%" stop-color="#1a0a0e"/>
      <stop offset="100%" stop-color="#0d0507"/>
    </linearGradient>
  </defs>
  <rect width="480" height="900" fill="url(#b2)"/>
  <!-- 对称轴线 -->
