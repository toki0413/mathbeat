  <circle cx="240" cy="450" r="100" fill="none" stroke="#E8587A" stroke-width="0.5" opacity="0.03"/>
  <!-- 镜像弧线 -->
  <path d="M 60 200 Q 240 100 420 200" fill="none" stroke="#E8587A" stroke-width="1" opacity="0.04"/>
  <path d="M 60 700 Q 240 800 420 700" fill="none" stroke="#E8587A" stroke-width="1" opacity="0.04"/>
