<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Mascot: Math Note - 音符 + 数学符号精灵 -->
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C6BFF"/>
      <stop offset="100%" stop-color="#E8587A"/>
    </linearGradient>
  </defs>
  <!-- 身体：音符符头 -->
  <ellipse cx="50" cy="70" rx="16" ry="12" fill="url(#mg)"/>
  <!-- 尾巴 -->
  <path d="M 66 70 Q 66 30 66 20 Q 66 10 82 14 Q 86 15 82 22 Q 80 25 74 24 Q 70 23 70 20 L 70 70" fill="none" stroke="url(#mg)" stroke-width="4" stroke-linecap="round"/>
  <!-- 眼睛 -->
  <circle cx="44" cy="68" r="2.5" fill="white" opacity="0.9"/>
  <circle cx="56" cy="68" r="2.5" fill="white" opacity="0.9"/>
  <circle cx="44.5" cy="68.5" r="1" fill="#333"/>
  <circle cx="56.5" cy="68.5" r="1" fill="#333"/>
  <!-- 数学符号光环 -->
  <text x="50" y="18" text-anchor="middle" font-size="12" fill="#FFD166" font-family="serif" font-weight="bold">∑</text>
  <!-- 小音符装饰 -->
  <circle cx="22" cy="35" r="2" fill="#4ECDC4" opacity="0.6"/>
  <circle cx="78" cy="28" r="1.5" fill="#FF8C42" opacity="0.6"/>
  <circle cx="85" cy="45" r="2" fill="#7BC67E" opacity="0.5"/>
</svg>